<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PC Forge — Monte o PC dos seus sonhos com inteligência. Assistente completo de montagem de PCs e notebooks para todos os níveis." />
  <meta name="theme-color" content="#07070f" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formsubmit.co; form-action https://formsubmit.co; base-uri 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; worker-src 'none'; upgrade-insecure-requests" />
  <title>PC Forge — Monte Seu PC Ideal</title>

  <!-- Favicon SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Navigation Bar -->
  <nav id="navbar">
    <div class="nav-inner">
      <button class="nav-logo" id="nav-home">
        <span class="nav-logo-icon">⚙️</span>
        <span class="nav-logo-text">PC<span class="accent">Forge</span></span>
      </button>
      <div class="nav-links">
        <button class="nav-btn" id="nav-wizard">🚀 Montar</button>
        <button class="nav-btn" id="nav-manual">⚙️ Avançado</button>
        <button class="nav-btn" id="nav-faq">❓ FAQ</button>
        <button class="nav-btn" id="nav-contact">✉️ Contato</button>
      </div>
      <button class="nav-btn nav-menu" id="nav-toggle" aria-label="Menu">☰</button>
    </div>
    <div class="nav-mobile" id="nav-mobile">
      <button class="nav-btn" id="nav-wizard-m">🚀 Montar PC</button>
      <button class="nav-btn" id="nav-manual-m">⚙️ Modo Avançado</button>
      <button class="nav-btn" id="nav-faq-m">❓ FAQ</button>
      <button class="nav-btn" id="nav-contact-m">✉️ Contato</button>
    </div>
  </nav>

  <!-- Price banner (shown globally) -->
  <div id="price-banner" class="price-banner" style="display:none"></div>

  <!-- App Container -->
  <main id="app">
    <!-- Rendered by JavaScript -->
    <div class="page" style="display:flex;align-items:center;justify-content:center;min-height:70vh;">
      <div style="text-align:center">
        <div style="font-size:3rem;animation:spin 1.5s linear infinite;display:inline-block">⚙️</div>
        <p style="margin-top:1rem;color:var(--text2)">Carregando PC Forge...</p>
      </div>
    </div>
  </main>

  <!-- Data layer -->
  <script src="js/data.js"></script>

  <!-- Build engine -->
  <script src="js/builder.js"></script>

  <!-- PDF export -->
  <script src="js/pdf-export.js"></script>

  <!-- Main app -->
  <script src="js/app.js"></script>

  <!-- Navigation controller kept external so CSP can block inline scripts -->
  <script src="js/navigation.js"></script>

</body>
</html>
