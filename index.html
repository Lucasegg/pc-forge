<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PC Forge — Monte o PC dos seus sonhos com inteligência. Assistente completo de montagem de PCs e notebooks para todos os níveis." />
  <meta name="theme-color" content="#07070f" />
  <title>PC Forge — Monte Seu PC Ideal</title>

  <!-- Favicon SVG inline -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>" />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- Navigation Bar -->
  <nav id="navbar">
    <div class="nav-inner">
      <button class="nav-logo" id="nav-home">
        <span class="nav-logo-icon">⚙️</span>
        <span class="nav-logo-text">PC<span class="accent">Forge</span></span>
      </button>
      <div class="nav-links">
        <button class="nav-btn" id="nav-wizard">🚀 Montar</button>
        <button class="nav-btn" id="nav-manual">⚙️ Avançado</button>
        <button class="nav-btn" id="nav-saved">💾 Builds</button>
        <button class="nav-btn" id="nav-faq">❓ FAQ</button>
        <button class="nav-btn" id="nav-contact">✉️ Contato</button>
      </div>
      <button class="nav-btn nav-menu" id="nav-toggle" aria-label="Menu">☰</button>
    </div>
    <div class="nav-mobile" id="nav-mobile">
      <button class="nav-btn" id="nav-wizard-m">🚀 Montar PC</button>
      <button class="nav-btn" id="nav-manual-m">⚙️ Modo Avançado</button>
      <button class="nav-btn" id="nav-saved-m">💾 Meus Builds</button>
      <button class="nav-btn" id="nav-faq-m">❓ FAQ</button>
      <button class="nav-btn" id="nav-contact-m">✉️ Contato</button>
    </div>
  </nav>

  <!-- Price banner (shown globally) -->
  <div id="price-banner" class="price-banner" style="display:none"></div>

  <!-- App Container -->
  <main id="app">
    <!-- Rendered by JavaScript -->
    <div class="page" style="display:flex;align-items:center;justify-content:center;min-height:70vh;">
      <div style="text-align:center">
        <div style="font-size:3rem;animation:spin 1.5s linear infinite;display:inline-block">⚙️</div>
        <p style="margin-top:1rem;color:var(--text2)">Carregando PC Forge...</p>
      </div>
    </div>
  </main>

  <!-- Data layer -->
  <script src="js/data.js"></script>

  <!-- Build engine -->
  <script src="js/builder.js"></script>

  <!-- Main app -->
  <script src="js/app.js"></script>

  <!-- Navbar controller (inline for simplicity) -->
  <script>
    // Navbar navigation
    const navActions = {
      'nav-home':     () => document.getElementById('btn-back-home')?.click() || App.init(),
      'nav-wizard':   () => { document.getElementById('btn-start')?.click(); },
      'nav-manual':   () => { document.getElementById('btn-manual')?.click(); },
      'nav-saved':    () => { document.getElementById('btn-all-saved')?.click(); },
      'nav-wizard-m': () => { document.getElementById('btn-start')?.click(); closeMenu(); },
      'nav-manual-m': () => { document.getElementById('btn-manual')?.click(); closeMenu(); },
      'nav-saved-m':  () => { document.getElementById('btn-all-saved')?.click(); closeMenu(); },
    };

    function closeMenu() {
      document.getElementById('nav-mobile').classList.remove('open');
    }

    document.getElementById('nav-toggle').addEventListener('click', () => {
      document.getElementById('nav-mobile').classList.toggle('open');
    });

    // Inject a ghost button into #app so App's event delegation handles it
    function navTo(btnId) {
      closeMenu();
      const existing = document.getElementById(btnId);
      if (existing) { existing.click(); return; }
      const ghost = document.createElement('button');
      ghost.id = btnId;
      ghost.style.display = 'none';
      document.getElementById('app').appendChild(ghost);
      ghost.click();
      ghost.remove();
    }

    Object.entries(navActions).forEach(([id]) => {
      const el = document.getElementById(id);
      if (!el) return;
      // Derive target btn id from map
      const map = {
        'nav-home': 'btn-back-home', 'nav-wizard': 'btn-start', 'nav-manual': 'btn-manual',
        'nav-saved': 'btn-all-saved', 'nav-faq': 'btn-faq-nav', 'nav-contact': 'btn-contact-nav',
        'nav-wizard-m': 'btn-start', 'nav-manual-m': 'btn-manual', 'nav-saved-m': 'btn-all-saved',
        'nav-faq-m': 'btn-faq-nav', 'nav-contact-m': 'btn-contact-nav'
      };
      el.addEventListener('click', () => navTo(map[id]));
    });

    // Keyboard shortcut: Ctrl+B = new build
    document.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'b') {
        e.preventDefault();
        navTo('btn-start');
      }
    });
  </script>

  <style>
    /* Loading spinner */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ── Navbar ── */
    #navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(7,7,15,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #1f1f3a;
    }

    .nav-inner {
      max-width: 1300px;
      margin: 0 auto;
      padding: .75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: .5rem;
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 900;
      letter-spacing: -.02em;
      padding: .2rem .5rem;
      border-radius: 8px;
      transition: background .2s;
      flex-shrink: 0;
    }

    .nav-logo:hover { background: rgba(108,99,255,.1); }
    .nav-logo-icon { font-size: 1.4rem; }

    .nav-links {
      display: flex;
      gap: .4rem;
      flex: 1;
      justify-content: flex-end;
    }

    .nav-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #9898b8;
      font-family: var(--font);
      font-size: .85rem;
      font-weight: 600;
      padding: .45rem .9rem;
      cursor: pointer;
      transition: all .2s;
    }

    .nav-btn:hover {
      color: var(--text);
      border-color: #2a2a4a;
      background: rgba(255,255,255,.04);
    }

    .nav-menu { display: none; font-size: 1.2rem; padding: .4rem .7rem; }

    .nav-mobile {
      display: none;
      flex-direction: column;
      gap: .2rem;
      padding: .5rem 1.5rem .75rem;
      border-top: 1px solid #1f1f3a;
    }

    .nav-mobile.open { display: flex; }

    @media (max-width: 640px) {
      .nav-links { display: none; }
      .nav-menu { display: flex; }
    }
  </style>

</body>
</html>
